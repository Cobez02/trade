name: SPX-Beater continuous watcher

# The hourly `trade` workflow decides what to BUY. This one decides what to
# SELL, and it looks at every open position roughly every quarter-second rather
# than once an hour. The gap between those cadences is not academic: a position
# that read -29% at one hourly check was liquidated at -51% at the next, and the
# whole loss happened in the 41 minutes when nothing was watching.
#
# Two jobs, not one, because a GitHub Actions job is capped at 6 hours and the
# US session is 6.5. The first covers the open, the second hands over at ~17:07
# UTC and runs through the closing flatten. (:07, not :00 — top-of-hour is
# GitHub's most congested cron slot; the concurrency group queues the second
# job until the first one's 215-minute timeout releases it, so the handover
# stays contiguous either way.)
#
# ---------------------------------------------------------------------------
# BEFORE ENABLING THIS, CHECK WHETHER THE REPO IS PUBLIC.
# Actions minutes are free on public repos and metered on private ones. This
# workflow runs ~6.5 hours a weekday, which is ~8,000 minutes a month — far past
# the 2,000-minute free allowance on a private repo. On a private repo, either
# make the repo public or leave this disabled and rely on the resting broker
# stops, which the hourly workflow now arms on every position and which Alpaca
# evaluates continuously on its own side regardless of what runs here.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "31 13 * * 1-5"       # from the open, hands over at ~17:07
    - cron: "7 17 * * 1-5"        # through to the closing flatten
  workflow_dispatch: {}

concurrency:
  group: spxbot-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # Killed a few minutes after the bell so a hung run cannot bill all day.
    timeout-minutes: 215
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Self-test the exit rules before touching the account
        run: |
          python test_exitrules.py
          python test_watcher.py
          python test_spreads.py
          python test_journal.py
          python test_config.py

      - name: Watch
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SPXBOT_EOD_FLATTEN_MIN: "15"
          SPXBOT_WATCH_STREAM: "1"
          # Entry scans: the watcher fires main.py in entries-only mode every
          # ~5 minutes (ENTRY_SCAN_SECONDS in watcher.py) and the child
          # process inherits THIS env, not trade.yml's. These pins are the
          # code defaults today, but if trade.yml ever changes a cap, change
          # it here too or the two entry paths will silently diverge.
          SPXBOT_MAX_PREM: "450"
          # 2026-08-31 change set, from the intraday live-parity backtest.
          # Was 600. Raising the cap is monotonically destructive at every
          # expiry tested (15 cells); $450 is the best cap at BOTH 21 and 35
          # DTE on out-of-sample P&L after 1% cost, and it cuts the worst
          # single-trade loss from -$179 to about -$120.
          #
          # Expiry: was the 3-12 day default, i.e. weeklies. Weeklies bleed
          # theta for every hour of an intraday hold and the sleeve loses money
          # on them at ZERO assumed cost. DTE_PREFER makes the window mean
          # something: without it find_contracts ranks on strike distance alone
          # and would mix 14- and 35-day contracts arbitrarily.
          SPXBOT_DTE_MIN: "14"
          SPXBOT_DTE_MAX: "35"
          SPXBOT_DTE_PREFER: "21"
          # One entry per underlying per session, across sleeves. Measured, not
          # assumed: it improves every metric at both the old and the new
          # configuration, and most where the strategy is worst.
          SPXBOT_UNDERLYING_COOLDOWN: "1"
          SPXBOT_MAX_OPEN: "3"
          SPXBOT_NO_NEW_ENTRY_MIN: "90"
          SPXBOT_SPREADS: "0"
          # Alerting (same owner-added secrets as trade.yml; unset = silently
          # off). Without these the whole 6.5-hour watcher session — and every
          # entry scan it spawns — would run with alerts and the dead-man's
          # switch disabled.
          SPXBOT_WA_PHONE: ${{ secrets.SPXBOT_WA_PHONE }}
          SPXBOT_WA_APIKEY: ${{ secrets.SPXBOT_WA_APIKEY }}
          SPXBOT_HEALTHCHECK_URL: ${{ secrets.SPXBOT_HEALTHCHECK_URL }}
          SPXBOT_ALERT_WEBHOOK: ${{ secrets.SPXBOT_ALERT_WEBHOOK }}
          SPXBOT_TG_TOKEN: ${{ secrets.SPXBOT_TG_TOKEN }}
          SPXBOT_TG_CHAT: ${{ secrets.SPXBOT_TG_CHAT }}
        run: python watcher.py

      - name: Report what it did
        if: always()
        run: |
          {
            echo '## Watcher session'
            echo '```'
            tail -c 8000 watcher.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

# schedule-poke 2026-07-28 (2nd): first poke got 4 firings, then the hourly
# cron went quiet again after 16:30 and the 19:45/50/55 flatten trio missed.
# New-repo scheduling is notoriously erratic in week one; each edit of this
# file re-registers. The reliable stabiliser remains one manual dispatch.

# schedule re-poke 2026-08-10: first production session of continuous entry
# scanning. Handover cron moved 17:00 → 17:07 (top-of-hour congestion), env
# parity added so watcher-spawned entry scans run with the same caps and
# alert channels as the hourly workflow.

# Proxy backtest inside Actions: 10 years of Alpaca SIP minute bars on SPY (~MES) and QQQ (~MNQ),
# costs set to the futures' equivalents, report committed to research/<date>/.
# Triggers on manual dispatch or when this file changes.
# Cost mapping: 1 MES ~= 50 SPY shares; MES round trip = 2 x ($1.00 comm + $1.25 slip) = $4.50
#   -> 9c per SPY share round trip -> 4.5c/side.  1 MNQ ~= 80 QQQ shares; MNQ round trip
#   = 2 x ($1.00 + $0.50) = $3.00 -> 3.75c/share -> 1.9c/side.
name: backtest
on:
  workflow_dispatch:
    inputs:
      start:   { default: "2016-01-04", description: "history start" }
      end:     { default: "2026-09-05", description: "history end" }
      holdout: { default: "2024-01-01", description: "out-of-sample from" }
  push:
    paths: [".github/workflows/backtest.yml"]
permissions:
  contents: write      # the run commits state / reports back; the repo default token is read-only
concurrency:
  group: spxf-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      SPXF_ALPACA_FEED: ${{ vars.SPXF_ALPACA_FEED || 'sip' }}
      START:   ${{ github.event.inputs.start   || '2016-01-04' }}
      END:     ${{ github.event.inputs.end     || '2026-09-05' }}
      HOLDOUT: ${{ github.event.inputs.holdout || '2024-01-01' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m tests.test_core
      - name: S1 QQQ, corrected regime
        if: always()
        env: { SPXF_INSTRUMENT: QQQ, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "1.9" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/QQQ-regime; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol QQQ --instrument QQQ --regime \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: SPY baseline (no switch)
        if: always()
        env: { SPXF_INSTRUMENT: SPY, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "4.5" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/SPY-base; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol SPY --instrument SPY \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: SPY + corrected regime
        if: always()
        env: { SPXF_INSTRUMENT: SPY, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "4.5" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/SPY-regime; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol SPY --instrument SPY --regime \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: IWM baseline (no switch)
        if: always()
        env: { SPXF_INSTRUMENT: SPY, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "3.6" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/IWM-base; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol IWM --instrument SPY \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: IWM + corrected regime
        if: always()
        env: { SPXF_INSTRUMENT: SPY, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "3.6" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/IWM-regime; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol IWM --instrument SPY --regime \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: DIA baseline (no switch)
        if: always()
        env: { SPXF_INSTRUMENT: SPY, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "6.2" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/DIA-base; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol DIA --instrument SPY \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: DIA + corrected regime
        if: always()
        env: { SPXF_INSTRUMENT: SPY, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "6.2" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/DIA-regime; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol DIA --instrument SPY --regime \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: grid QQQ lookback 10 pct 0.4
        if: always()
        env: { SPXF_INSTRUMENT: QQQ, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "1.9" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/grid/QQQ-lb10-p40; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol QQQ --instrument QQQ --regime --regime-lookback 10 --regime-pct 0.4 --lookback 14 \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: grid QQQ lookback 10 pct 0.5
        if: always()
        env: { SPXF_INSTRUMENT: QQQ, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "1.9" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/grid/QQQ-lb10-p50; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol QQQ --instrument QQQ --regime --regime-lookback 10 --regime-pct 0.5 --lookback 14 \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: grid QQQ lookback 10 pct 0.6
        if: always()
        env: { SPXF_INSTRUMENT: QQQ, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "1.9" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/grid/QQQ-lb10-p60; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol QQQ --instrument QQQ --regime --regime-lookback 10 --regime-pct 0.6 --lookback 14 \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: grid QQQ lookback 14 pct 0.4
        if: always()
        env: { SPXF_INSTRUMENT: QQQ, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "1.9" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/grid/QQQ-lb14-p40; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol QQQ --instrument QQQ --regime --regime-lookback 14 --regime-pct 0.4 --lookback 14 \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: grid QQQ lookback 14 pct 0.6
        if: always()
        env: { SPXF_INSTRUMENT: QQQ, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "1.9" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/grid/QQQ-lb14-p60; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol QQQ --instrument QQQ --regime --regime-lookback 14 --regime-pct 0.6 --lookback 14 \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: grid QQQ lookback 20 pct 0.4
        if: always()
        env: { SPXF_INSTRUMENT: QQQ, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "1.9" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/grid/QQQ-lb20-p40; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol QQQ --instrument QQQ --regime --regime-lookback 20 --regime-pct 0.4 --lookback 14 \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: grid QQQ lookback 20 pct 0.5
        if: always()
        env: { SPXF_INSTRUMENT: QQQ, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "1.9" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/grid/QQQ-lb20-p50; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol QQQ --instrument QQQ --regime --regime-lookback 20 --regime-pct 0.5 --lookback 14 \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: grid QQQ lookback 20 pct 0.6
        if: always()
        env: { SPXF_INSTRUMENT: QQQ, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "1.9" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-regime/grid/QQQ-lb20-p60; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol QQQ --instrument QQQ --regime --regime-lookback 20 --regime-pct 0.6 --lookback 14 \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 3000 --max-contracts 60 --presets mffu_core_50k --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -30
      - name: show results in the job summary
        if: always()
        run: |
          DIR=research/$(date -u +%F)
          for f in "$DIR"/SPY-as-MES/*_report.md "$DIR"/QQQ-as-MNQ/*_report.md; do
            [ -f "$f" ] || continue
            echo "## $f" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"; cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
          echo "### tail of run logs" >> "$GITHUB_STEP_SUMMARY"
          for f in "$DIR"/*/run.log; do [ -f "$f" ] && { echo "#### $f" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -40 "$f" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; }; done
          ls -la "$DIR"/*/ || true
      - name: SPY trail=none variant (hold to flatten or stop)
        if: always()
        env: { SPXF_INSTRUMENT: SPY, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "4.5" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-lots10/SPY-as-MES-trail-none; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol SPY --instrument SPY --trail none \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 5000 --max-contracts 60 --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -60
      - name: QQQ trail=none variant
        if: always()
        env: { SPXF_INSTRUMENT: QQQ, SPXF_PROXY_SHARES: "10", SPXF_PROXY_SLIP_CENTS: "1.9" }
        run: |
          set -o pipefail; OUT=research/$(date -u +%F)-lots10/QQQ-as-MNQ-trail-none; mkdir -p "$OUT"
          python -u -m scripts.run_backtest --source alpaca --symbol QQQ --instrument QQQ --trail none \
            --start "$START" --end "$END" --holdout-from "$HOLDOUT" --mc 5000 --max-contracts 60 --out "$OUT" 2>&1 | tee "$OUT/run.log" | tail -60
      - name: commit the reports
        if: always()
        run: |
          git config user.name spxf-bot; git config user.email bot@users.noreply.github.com
          git stash -u -- cache state_futures.json days.jsonl 2>/dev/null || true
          git add -f research/ 2>/dev/null || true
          git status --short
          ls research/*/*/*report.md || { echo "NO REPORT FILES PRODUCED"; exit 1; }
          git commit -m "backtest $(date -u +%FT%H:%MZ): SPY-as-MES, QQQ-as-MNQ ($START..$END, holdout $HOLDOUT)"
          ok=0; for i in 1 2 3; do
            git fetch -q origin main && git rebase origin/main && git push origin HEAD:main && { echo "PUSHED"; ok=1; break; } || { echo "retry $i"; sleep 5; }
          done; [ "$ok" = 1 ] || { echo "PUSH FAILED"; exit 1; }

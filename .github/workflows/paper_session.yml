# Alpaca PAPER forward-test of the futures logic on the QQQ share proxy (1 lot = 20 shares ~ 1/4 MNQ).
# GitHub's cron is best-effort and ran the 08:26 CT jobs ~3.5 h late on 9/10 and 9/11, so the lab was
# awake only after the entry cutoff. Therefore: jobs start HOURS before the open (the runner sleeps
# until 08:30 CT), each job hands over on ELAPSED RUNTIME (--max-minutes), and the concurrency group
# chains them: while one runs, the newest scheduled job waits and starts the moment it ends. Whatever
# the delay, something is awake from the open to the flatten. Times below are UTC; the runner works
# in the exchange zone, so DST needs no edit.
name: paper-session
on:
  schedule:
    - cron: "0 10 * * 1-5"    # 05:00 CT (CDT) / 04:00 CT (CST): job 1, sleeps until the open
    - cron: "0 13 * * 1-5"    # 08:00 / 07:00 CT: pending behind job 1, takes over when it exits
    - cron: "0 16 * * 1-5"    # 11:00 / 10:00 CT: replaces the pending job so the afternoon is covered
    - cron: "0 18 * * 1-5"    # 13:00 / 12:00 CT: safety net for a badly delayed morning
  workflow_dispatch:
permissions:
  contents: write      # the run commits state / reports back; the repo default token is read-only
concurrency:
  group: spxf-paper
  cancel-in-progress: false
jobs:
  session:
    runs-on: ubuntu-latest
    timeout-minutes: 215
    env:
      # first-half crons hand over at 11:50 CT (clean exit, position + resting stop carried to job 2)
      SPXF_UNTIL: ${{ contains(fromJSON('["26 13 * * 1-5","26 14 * * 1-5"]'), github.event.schedule) && '11:50' || '' }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      SPXF_ALPACA_FEED: ${{ vars.SPXF_ALPACA_FEED || 'sip' }}   # set the repo variable to iex if you drop Algo Trader Plus
      SPXF_INSTRUMENT: SPY
      SPXF_PROXY_SHARES: "20"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: self-test
        run: python -m tests.test_core
      - name: run session (exits immediately on the wrong DST variant, a holiday, or after the flatten)
        run: |
          SKIP=$(python - <<'PY'
          import datetime as dt
          from data import sessions as S
          now = S.now_ct(); d = now.date()
          o, c, f, _ = S.session_bounds(d)
          if not S.is_trading_day(d): print("holiday/weekend")
          elif now >= f: print("after flatten")
          PY
          )
          if [ -n "$SKIP" ]; then echo "skip: $SKIP"; exit 0; fi
          mkdir -p logs
          python -m live.runner --broker alpaca --symbol QQQ --instrument QQQ --source alpaca \
            --start $(date -u -d '-45 days' +%F) --end $(date -u +%F) --max-minutes 345
      - name: telegram end-of-day summary (optional, uses the existing SPXBOT_TG_* secrets)
        if: always()
        env:
          TG_TOKEN: ${{ secrets.SPXBOT_TG_TOKEN }}
          TG_CHAT: ${{ secrets.SPXBOT_TG_CHAT }}
        run: |
          if [ -n "$TG_TOKEN" ] && [ -f days.jsonl ] && tail -n1 days.jsonl | grep -q "\"day\": \"$(date -u +%F)\""; then
            curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              -d chat_id="${TG_CHAT}" --data-urlencode text="spxf paper: $(tail -n1 days.jsonl)" >/dev/null || true
          fi
      - name: commit state
        if: always()
        run: |
          git config user.name spxf-bot; git config user.email bot@users.noreply.github.com
          git add state_futures.json 2>/dev/null || true
          git add days.jsonl 2>/dev/null || true
          git add logs/ 2>/dev/null || true
          git commit -m "paper session $(date -u +%FT%H:%MZ)" || echo "nothing to commit"
          git push || echo "push skipped"

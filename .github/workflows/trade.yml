name: SPX-Beater options bot

# Runs hourly during US market hours (10:00–16:00 ET), Mon–Fri.
# Cron is in UTC; 14:00–20:00 UTC = 10:00–16:00 ET (EDT). GitHub may delay
# scheduled runs a few minutes under load — fine for an hourly bot.
on:
  schedule:
    # Hourly trading runs, 10:00–16:00 ET.
    - cron: "0 14-20 * * 1-5"
    # Close-the-book runs. Nothing is carried overnight, so a run MUST land in
    # the final 15 minutes or the flatten never fires. GitHub routinely delays
    # scheduled runs under load, so three attempts are scheduled rather than one
    # — a single 19:45 job delayed past the bell would strand the whole book.
    - cron: "45,50,55 19 * * 1-5"
    # Same, for early-close sessions (13:00 ET bell: July 3rd, Black Friday,
    # Christmas Eve). On a normal day these land ~3 hours before the close and
    # do nothing; SPXBOT_FLATTEN_ONLY stops them churning entries.
    - cron: "45,50,55 16 * * 1-5"
  workflow_dispatch: {}          # lets you run it manually from the Actions tab

permissions:
  contents: write                # so the run can commit state.json + dashboard.html back

concurrency:
  group: spxbot
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SPXBOT_STARTED: "2026-07-24"
          SPXBOT_BENCH_START: "738.06"
          SPXBOT_BASELINE: "100000"
          SPXBOT_MAX_PREM: "350"
          SPXBOT_MAX_OPEN: "2"
          SPXBOT_EOD_FLATTEN_MIN: "15"
          SPXBOT_NO_NEW_ENTRY_MIN: "90"
          # The close-the-book crons manage exits only. Any other trigger
          # (hourly schedule, or a manual Actions run) does a full cycle.
          SPXBOT_FLATTEN_ONLY: ${{ (github.event.schedule == '45,50,55 19 * * 1-5' || github.event.schedule == '45,50,55 16 * * 1-5') && '1' || '0' }}
        run: |
          python main.py | tee run.log
          python reporting.py state.json > digest.txt
          {
            echo '## SPX-Beater — latest run'
            echo '```'
            cat digest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist state + dashboard
        run: |
          git config user.name  "spx-beater-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A state.json dashboard.html
          git commit -m "run $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push || echo "push skipped"

# Overnight sleeve on Alpaca PAPER: buy QQQM (~$50k, one MNQ-equivalent) at 14:57 CT, sell at 08:31 CT
# the next session. Weekday nights only. Jobs start hours early and wait (GitHub's cron runs late);
# separate concurrency group from the intraday session so both run in parallel.
name: overnight-session
on:
  schedule:
    - cron: "0 16 * * 1-4"    # ~11:00 CT — buy job, waits until 14:57 CT  (Mon-Thu)
    - cron: "30 18 * * 1-4"   # ~13:30 CT — backup buy (skips if already holding)
    - cron: "30 19 * * 1-4"   # ~14:30 CT — last-chance buy
    - cron: "0 9 * * 2-5"     # ~04:00 CT — sell job, waits until 08:31 CT (Tue-Fri)
    - cron: "0 12 * * 2-5"    # ~07:00 CT — backup sell
    - cron: "45 13 * * 2-5"   # ~08:45 CT — last-chance sell (inside the 25-min grace)
  workflow_dispatch:
    inputs:
      action: { default: "sell", description: "buy or sell" }
permissions:
  contents: write
concurrency:
  group: spxf-overnight
  cancel-in-progress: false
jobs:
  overnight:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      SPXF_ALPACA_FEED: ${{ vars.SPXF_ALPACA_FEED || 'sip' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: mkdir -p logs
      - name: buy or sell (decided by the clock, or by the dispatch input)
        run: |
          ACTION="${{ github.event.inputs.action }}"
          if [ -z "$ACTION" ]; then
            # Decide by the schedule that triggered us, not by the wall clock at start
            # (GitHub runs jobs late; a delayed buy job used to reinterpret itself as a sell).
            case "${{ github.event.schedule }}" in
              "0 16 * * 1-4"|"30 18 * * 1-4"|"30 19 * * 1-4") ACTION=buy ;;
              *) ACTION=sell ;;
            esac
          fi
          echo "action=$ACTION (schedule='${{ github.event.schedule }}')"
          python -u -m live.overnight --action "$ACTION" 2>&1 | tee -a logs/overnight-$(TZ=America/Chicago date +%F).log
      - name: commit the record (append-only union)
        if: always()
        run: bash scripts/commit_records.sh "overnight"
